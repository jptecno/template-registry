[config]
response_language = "pt-BR"
repo_context_files = ["README.md"]
repo_context_from_default_branch = true

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = false
require_ticket_analysis_review = false
persistent_comment = true
num_max_findings = 5
extra_instructions = """
Revise somente alterações em registry.json, scripts/, .github/workflows/ e README.md.
Priorize compatibilidade do contrato do registry com a CLI e riscos de supply chain: origem do repositório, tags imutáveis, igualdade version/ref, archive e template.json.
Confirme que workflows usam permissões mínimas, Actions por SHA e não usam pull_request_target nem executam conteúdo não confiável.
Não execute, instale ou compile código do pull request ou dos templates. Não comente estilo nem proponha arquitetura, pacote/schema compartilhado ou matriz da CLI.
Trate downgrade, troca de repositório e mudança de schema como heurísticas que exigem confirmação, não como defeitos certos.
"""
