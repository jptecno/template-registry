name: Validate registry

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate registry schema
        run: node scripts/validate-registry.mjs
