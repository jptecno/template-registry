name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - registry.json
      - scripts/**
      - .github/workflows/**
      - README.md

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    name: PR-Agent advisory
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review pull request
        continue-on-error: true
        uses: qodo-ai/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc # v0.45.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CONFIG.ENABLE_TELEMETRY: 'false'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: 'true'
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'
