name: Static analysis

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: static-analysis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up reviewdog
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.20.3

      - name: Install Semgrep CE
        run: python3 -m pip install --disable-pip-version-check semgrep==1.172.0

      - name: Scan workflows and scripts
        id: semgrep
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          set +e
          semgrep scan --config .semgrep/rules --exclude .semgrep/rules --error --sarif --output semgrep.sarif .github/workflows scripts
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publish findings on the diff
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: reviewdog -f=sarif -name=semgrep -reporter=github-pr-review -filter-mode=added < semgrep.sarif

      - name: Enforce Semgrep result
        if: ${{ always() }}
        env:
          SEMGREP_STATUS: ${{ steps.semgrep.outputs.status }}
        run: |
          if [ "${SEMGREP_STATUS}" != "0" ]; then
            echo "Semgrep encontrou violações ou falhou com status ${SEMGREP_STATUS}."
            exit "${SEMGREP_STATUS}"
          fi
