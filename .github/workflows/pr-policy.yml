name: Pull request policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  danger:
    name: Danger JS
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Check trusted Dangerfile
        id: dangerfile
        run: |
          if [[ -f dangerfile.mjs ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Danger JS será ativado após este workflow chegar à branch base.'
          fi

      - name: Check policy changes
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' > /tmp/changed-files
          if grep -Eq '^(dangerfile\.mjs|scripts/danger/)' /tmp/changed-files; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Danger JS não executa alterações da própria política antes do merge.'
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: >-
          steps.dangerfile.outputs.available == 'true' &&
          steps.policy.outputs.changed == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install trusted Danger dependencies
        if: >-
          steps.dangerfile.outputs.available == 'true' &&
          steps.policy.outputs.changed == 'false'
        run: npm ci --ignore-scripts

      - name: Review pull request policies
        if: >-
          steps.dangerfile.outputs.available == 'true' &&
          steps.policy.outputs.changed == 'false'
        env:
          DANGER_GITHUB_API_TOKEN: ${{ github.token }}
        run: ./node_modules/.bin/danger ci --dangerfile dangerfile.mjs
