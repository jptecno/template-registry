rules:
  - id: github-actions-pull-request-target
    message: Não use pull_request_target; ele combina privilégios da base com conteúdo controlado pelo PR.
    severity: ERROR
    languages: [yaml]
    pattern: |
      pull_request_target: $EVENT
    paths:
      include:
        - /.github/workflows/*.yml
        - /.github/workflows/*.yaml
        - /dangerous-workflow.test.yaml
    metadata:
      confidence: HIGH
      category: security

  - id: github-actions-unpinned-third-party-action
    message: Fixe Actions de terceiros por SHA completo e documente a versão em comentário.
    severity: ERROR
    languages: [yaml]
    patterns:
      - pattern: |
          uses: $ACTION
      - metavariable-regex:
          metavariable: $ACTION
          regex: ^(?!\.?\.?/)(?!docker://)[^@\s]+@(?![0-9a-fA-F]{40}(?:\s*#.*)?$).+$
    paths:
      include:
        - /.github/workflows/*.yml
        - /.github/workflows/*.yaml
        - /dangerous-workflow.test.yaml
    metadata:
      confidence: HIGH
      category: security
